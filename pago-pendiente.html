<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago pendiente — La Tienda Bike</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
  
<body style="background: var(--color-paper); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;">
  <div style="background: #fff; border-radius: 14px; padding: 40px 28px; max-width: 480px; text-align: center;">
    <div style="font-size: 52px; margin-bottom: 8px;">⏳</div>
    <h1 style="font-family: var(--font-display); font-size: 28px; margin-bottom: 12px;" id="titulo-pendiente">Tu pago está pendiente</h1>
    <p style="color: #555; margin-bottom: 24px;">
      Estamos esperando la confirmación de tu medio de pago. Te avisaremos apenas se confirme.
    </p>
    <a href="/" style="display: inline-block; background: var(--color-ink); color: var(--color-yellow); padding: 12px 24px; border-radius: 9px; text-decoration: none; font-weight: 600;">
      Volver al catálogo
    </a>
  </div>
  <script>
    const nombre = localStorage.getItem("ultimoPedidoNombre");
    if (nombre) {
      const primerNombre = nombre.trim().split(" ")[0];
      document.getElementById("titulo-pendiente").textContent = `Tu pago está pendiente, ${primerNombre}`;
      localStorage.removeItem("ultimoPedidoNombre");
    }
  </script>
</body>
</html>
